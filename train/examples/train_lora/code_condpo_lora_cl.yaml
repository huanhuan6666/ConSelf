### model
model_name_or_path: /xxx/CodeLlama-7b-Instruct-hf
### method
stage: condpo # condpo dpo
do_train: true
finetuning_type: lora
pref_beta: 0.1
pref_loss: sigmoid
lora_rank: 16
lora_target: all

### dataset
dataset: code_dpo_pairs
template: llama2
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /xxx/CL_mydpo_lora
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
report_to: wandb